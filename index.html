<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:black;
overflow:hidden;
color:white;
text-align:center;
}

video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:-1;
}

.content{
padding:20px;
animation:fade 2s ease;
}

h1{
font-size:70px;
color:#ff4fd8;
text-shadow:
0 0 10px #ff4fd8,
0 0 20px #ff4fd8,
0 0 40px #ff4fd8;
margin-bottom:20px;
}

p{
font-size:28px;
line-height:45px;
}

button{
margin-top:35px;
padding:15px 35px;
font-size:22px;
border:none;
border-radius:50px;
background:#ff4fd8;
color:white;
box-shadow:0 0 20px #ff4fd8;
}

@keyframes fade{
from{
opacity:0;
transform:scale(0.8);
}
to{
opacity:1;
transform:scale(1);
}
}

</style>
</head>

<body>

<video autoplay muted loop>
<source src="https://cdn.coverr.co/videos/coverr-purple-sky-1560084265656?download=1080p" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="content">

<h1>Happy Birthday 🎂</h1>

<p>
Wishing You Endless Happiness ✨<br>
May Your Smile Always Shine 💖
</p>

<button>🎵 Play Music</button>

</div>

</body>
</html>
